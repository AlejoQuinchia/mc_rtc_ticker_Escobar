{
  "MainRobot" : "JVRC1NoHands",

  "Enabled"   : ["Python3#jvrc_interview.JVRCInterviewController"],

  "Timestep" : 0.005,

  "Log" : true,
  "LogPolicy" : "non-threaded",
  "LogDirectory": "/tmp",
  "LogTemplate" : "mc-rtc-jvrc-interview",

  "ClearControllerModulePath" : true,
  "ControllerModulePaths" : [
    "/workspace/workspace/build/projects/mc_rtc/src/mc_control/python",
    "/workspace/workspace/build/projects/mc_rtc/src/mc_observers"
  ],

  "ClearRobotModulePath" : true,
  "RobotModulePaths" : [
    "/workspace/workspace/build/projects/mc_rtc/src/mc_robots"
  ],

  "ClearObserverModulePath": true,
  "ObserverModulePaths": [
    "/workspace/workspace/build/projects/mc_rtc/src/mc_observers"
  ],

  "ClearGlobalPluginPath": true,
  "GlobalPluginPaths": [
    "/workspace/workspace/install/lib/mc_plugins"
  ],

  "Plugins": ["ROS"]
}